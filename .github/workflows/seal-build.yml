# Build-and-pack workflow for the ali-security fork: builds the embedded jars
# with the project's own Ant build and uploads tomcat-embed-core. The test suite
# runs on Travis (.travis.yml), not here.
name: seal-build

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Ant 1.10.9
        run: |
          wget -q https://archive.apache.org/dist/ant/binaries/apache-ant-1.10.9-bin.tar.gz
          tar xzf apache-ant-1.10.9-bin.tar.gz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-ant-1.10.9/bin" >> "$GITHUB_PATH"

      - name: Build embedded jars
        run: |
          java -version
          ant -version
          ant -noinput package embed-jars
          mkdir -p seal-dist
          cp output/embed/tomcat-embed-core.jar seal-dist/tomcat-embed-core-9.0.39.jar

      - uses: actions/upload-artifact@v4
        with:
          name: tomcat-embed-core
          path: seal-dist/tomcat-embed-core-9.0.39.jar
          if-no-files-found: error
